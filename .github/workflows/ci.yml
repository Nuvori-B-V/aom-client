name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12.*'
          - php: '8.5'
            laravel: '13.*'
    name: tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" --no-interaction --no-update
      - run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit
